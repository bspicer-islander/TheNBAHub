<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>TheNBAHub</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <header>
        <h1>TheNBAHub</h1>
        <p>
            This site explores the supplied dataset.
            Team assignments and point values are unverified and should not be treated as official NBA records.
        </p>
    </header>

    <main>
        <section aria-labelledby="players-heading">
            <h2 id="players-heading">Players</h2>

            <label for="search">Search by player name</label>
            <input type="search" id="search" placeholder="Enter a player's name">
            
            <label for="team-filter">Filter by listed team</label>
            <select id="team-filter">
                <option value="">All teams</option>
            </select>

            <label for="sort-order">Sort players</label>
            <select id="sort-order">
                <option value="name-asc">Name: A-Z</option>
                <option value="name-desc">Name: Z-A</option>
                <option value="points-desc">Listed points: highest first</option>
                <option value="points-asc">Listed points: lowest first</option>
            </select>

            <p id="status" role="status"></p>

            <div id="player-list"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
